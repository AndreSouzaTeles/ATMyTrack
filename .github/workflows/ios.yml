name: iOS build and tests
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild -project ios/ATMyTrack.xcodeproj -scheme ATMyTrack -configuration Release -sdk iphoneos -derivedDataPath ios/build/device CODE_SIGNING_ALLOWED=NO build | tee ios-device.log
          mkdir -p ios/build/package/Payload
          cp -R ios/build/device/Build/Products/Release-iphoneos/ATMyTrack.app ios/build/package/Payload/
          cd ios/build/package
          zip -qry ../ATMyTrack-iOS-0.1.0-UNSIGNED.ipa Payload
      - name: Test on iPhone simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          xcodebuild -project ios/ATMyTrack.xcodeproj -scheme ATMyTrack -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath ios/build/simulator -resultBundlePath ios/build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test | tee ios-tests.log
          xcrun simctl io "$DEVICE" screenshot ios/build/iPhone.png
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d ios/build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/Tests.xcresult --output-path ios/build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATMyTrack-iOS-build
          path: |
            ios/build/ATMyTrack-iOS-0.1.0-UNSIGNED.ipa
            ios/build/Tests.xcresult
            ios/build/iPhone.png
            ios/build/screenshots
            ios-*.log
          retention-days: 14
