name: ATMyTrack
options:
  bundleIdPrefix: com.atmytrack
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    GCC_OPTIMIZATION_LEVEL: '3'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  ATMyTrack:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atmytrack.app
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Audio/Bridge.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../app/src/main/cpp/vendor/stretch
          - $(SRCROOT)/../app/src/main/cpp/vendor/linear/include
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ATMyTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: O ATMyTrack precisa acessar o microfone para identificar a nota tocada pelo seu instrumento. A análise acontece somente neste aparelho.
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Brand
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        ITSAppUsesNonExemptEncryption: false
  ATMyTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Audio/Bridge.h
    dependencies:
      - target: ATMyTrack
  ATMyTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: ATMyTrack
schemes:
  ATMyTrack:
    build:
      targets:
        ATMyTrack: all
    test:
      targets: [ATMyTrackTests, ATMyTrackUITests]
